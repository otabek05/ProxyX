name: release

# Publishes a release when a tag like v1.2.3 is pushed manually
# (e.g. git tag v0.1.6 && git push origin v0.1.6). Merge-driven releases go
# through auto-release.yaml instead; this one is the manual escape hatch.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

