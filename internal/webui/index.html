<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProxyX Config Panel</title>
<style>
  :root {
    --bg: #0f141b; --panel: #161d27; --border: #26303d; --text: #e6edf3;
    --muted: #8b98a5; --accent: #3b82f6; --green: #22c55e; --red: #ef4444;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .badge {
    font-size: 11px; color: var(--muted); border: 1px solid var(--border);
    padding: 2px 8px; border-radius: 999px;
  }
  main { flex: 1; display: flex; min-height: 0; }
  aside {
    width: 280px; border-right: 1px solid var(--border); overflow-y: auto;
    padding: 12px; flex-shrink: 0;
  }
  aside .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  aside h2 { font-size: 12px; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; margin: 0; }
  .cfg {
    padding: 10px; border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 8px; cursor: pointer; background: var(--panel);
  }
  .cfg:hover { border-color: var(--accent); }
  .cfg .name { font-weight: 600; font-size: 14px; }
  .cfg .domain { font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .cfg .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  section { flex: 1; display: flex; flex-direction: column; padding: 14px; min-width: 0; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
  textarea {
    flex: 1; width: 100%; resize: none; background: #0b1016; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    font-family: var(--mono); font-size: 13px; line-height: 1.5; tab-size: 2;
  }
  button {
    font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.danger { color: var(--red); }
  .status { font-size: 13px; margin-left: auto; font-family: var(--mono); }
  .status.ok { color: var(--green); }
  .status.err { color: var(--red); }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 2px; }
</style>
</head>
<body>
<header>
  <h1>🧭 ProxyX Config Panel</h1>
  <span class="badge">localhost only</span>
</header>
<main>
  <aside>
    <div class="row">
      <h2>Configurations</h2>
      <button id="refresh" title="Reload">↻</button>
    </div>
    <div id="list"></div>
  </aside>
  <section>
    <div class="toolbar">
      <button id="new">＋ New</button>
      <button id="example">📝 Load example</button>
      <button id="apply" class="primary">⚡ Apply</button>
      <button id="delete" class="danger">🗑 Delete</button>
      <span id="status" class="status"></span>
    </div>
    <textarea id="editor" spellcheck="false" placeholder="Select a configuration, or click “New” / “Load example” to start…"></textarea>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let current = null; // metadata.name of the loaded config

function setStatus(msg, kind) {
  const el = $("status");
  el.textContent = msg || "";
  el.className = "status" + (kind ? " " + kind : "");
}

async function loadList() {
  const res = await fetch("/api/configs");
  const items = await res.json();
  const list = $("list");
  list.innerHTML = "";
  if (!items || items.length === 0) {
    list.innerHTML = '<div class="empty">No configurations yet.</div>';
    return;
  }
  for (const c of items) {
    const div = document.createElement("div");
    div.className = "cfg";
    div.innerHTML =
      '<div class="name"></div><div class="domain"></div>' +
      '<div class="meta">' + c.routes + ' route(s) · ' + c.file + '</div>';
    div.querySelector(".name").textContent = c.name;
    div.querySelector(".domain").textContent = c.domain;
    div.onclick = () => openConfig(c.name);
    list.appendChild(div);
  }
}

async function openConfig(name) {
  const res = await fetch("/api/configs/" + encodeURIComponent(name));
  if (!res.ok) { setStatus("Failed to load " + name, "err"); return; }
  $("editor").value = await res.text();
  current = name;
  setStatus("Loaded " + name, "ok");
}

async function loadExample() {
  const res = await fetch("/api/example");
  $("editor").value = await res.text();
  current = null;
  setStatus("Example loaded — edit and Apply", null);
}

async function apply() {
  const body = $("editor").value;
  if (!body.trim()) { setStatus("Editor is empty", "err"); return; }
  setStatus("Applying…", null);
  const res = await fetch("/api/apply", { method: "POST", body });
  const data = await res.json();
  if (!res.ok) { setStatus(data.error || "Apply failed", "err"); return; }
  setStatus("Applied & restarted ✓", "ok");
  await loadList();
}

async function removeCurrent() {
  if (!current) { setStatus("Open a saved config first", "err"); return; }
  if (!confirm("Delete configuration '" + current + "'? This restarts ProxyX.")) return;
  const res = await fetch("/api/configs/" + encodeURIComponent(current), { method: "DELETE" });
  const data = await res.json();
  if (!res.ok) { setStatus(data.error || "Delete failed", "err"); return; }
  $("editor").value = "";
  setStatus("Deleted '" + current + "' ✓", "ok");
  current = null;
  await loadList();
}

$("refresh").onclick = loadList;
$("new").onclick = () => { $("editor").value = ""; current = null; setStatus("New config — paste YAML or Load example", null); };
$("example").onclick = loadExample;
$("apply").onclick = apply;
$("delete").onclick = removeCurrent;
loadList();
</script>
</body>
</html>
